[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siim"
version = "0.1.0.dev0"
description = "Multi-modal, Sun-angle and scale invariant lunar image correspondence (SIH 2026, PS 26166)"
requires-python = ">=3.11"
# Everything imported at module scope anywhere under src/siim/, so that
# `pip install -e .` yields a repository that runs the test suite and the
# demonstrator without a second install step. Anything imported only inside a
# function, or only by a script under scripts/, lives in an extra below.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",          # siim.demo.api, scripts/build_demo_assets.py
    # SIFT/RootSIFT backend for siim.matching.rootsift. UPPER-BOUNDED, and the
    # bound is scientific rather than hygienic: every real-data number in this
    # repository is a function of this library's SIFT implementation, and
    # scripts/build_demo_assets.py refuses to write unless a re-run reproduces
    # the recorded statistics EXACTLY. An unbounded pin therefore lets a future
    # release silently break the repository's own certification step. The
    # producing environment is recorded in requirements-frozen.txt.
    "opencv-python>=4.9,<6",
    "requests>=2.31",        # siim.ingest.lro_nac -- PDS archive byte-range fetch
    # siim.demo is part of the installed package, so its server stack is a
    # runtime dependency rather than an extra. Mirrored in [demo] below.
    "fastapi>=0.110",        # siim.demo.api
    "pydantic>=2.0",         # siim.demo.api request models
    "uvicorn>=0.27",         # scripts/run_demo.py, the documented entry point
]

[project.optional-dependencies]
# The demo-serving stack, named so it can be audited and installed on its own.
# These are already core (siim.demo ships inside the package); listing them here
# documents which core dependencies exist only to serve the demonstrator.
demo = ["fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.27"]

# Figures and diagnostics. Imported lazily inside functions
# (e.g. siim.ingest.lro_nac imports matplotlib.path only when it needs it) and
# at module scope by the scripts that draw, so not required to import siim.
viz = ["matplotlib>=3.8"]

# Only the experiment drivers under scripts/ need these.
# scripts/run_exp002_threshold.py is the sole scikit-learn user (ROC/AP).
experiments = ["scikit-learn>=1.4", "matplotlib>=3.8"]

# httpx is not optional in practice: tests/test_demo_real_data.py and
# tests/test_demo_verdict.py drive the API through fastapi.testclient.TestClient,
# which raises at import time without it. matplotlib comes in because the
# experiment scripts are importable from the test session.
dev = ["pytest>=8.0", "httpx>=0.27", "matplotlib>=3.8"]

# Removed 2026-08-26: pyyaml was declared from the first commit and is imported
# nowhere in src/, scripts/ or tests/. pandas likewise had no importer.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests", "scripts"]
